name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt && pip install -e .
      - run: pytest -q
  # The live evals (evals/run_evals.py) need a Gemini key and BigQuery access; they run on a schedule
  # with secrets in the real pipeline, not on every push.
