[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analyst-agent"
version = "0.1.0"
description = "Data analysis chat agent over thelook_ecommerce (OpsFleet assignment)"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
analyst = "analyst.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["analyst"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
